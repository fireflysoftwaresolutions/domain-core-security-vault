spring:
  application:
    name: domain-core-security-vault
server:
  port: ${SERVER_PORT:18125}
firefly:
  eda:
    enabled: false
  stepevents:
    enabled: false
  vault:
    credential:
      adapter: sandbox
      core-base-url: http://localhost:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
